<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Free Professional CV Builder - Build your professional CV in minutes" />
<title>Free Professional CV Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root {
  --primary: #1f6f54;
  --primary-dark: #155941;
  --primary-light: #2e8b6c;
  --primary-soft: #e8f3ee;
  --accent: #d4af37;
  --bg: #f4f7f6;
  --panel: #ffffff;
  --text: #1a2b25;
  --text-soft: #5a6b66;
  --border: #d8e2dd;
  --shadow: 0 10px 30px rgba(31, 111, 84, 0.12);
  --radius: 14px;
  --danger: #e76470;
  --danger-soft: #fceced;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', 'Cairo', sans-serif;
  background: linear-gradient(135deg, #1f6f54 0%, #2e8b6c 100%);
  min-height: 100vh; color: var(--text);
  -webkit-font-smoothing: antialiased;
}
body[dir="rtl"] { font-family: 'Cairo', 'Inter', sans-serif; }

.app-header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary));
  color: #fff; padding: 14px 24px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.15);
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: 12px; margin-inline-end: auto; }
.brand-logo {
  width: 48px; height: 48px;
  background: var(--accent); color: var(--primary-dark);
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 800; font-size: 20px;
  font-family: 'Playfair Display', serif;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.brand-text p { font-size: 11px; opacity: 0.85; letter-spacing: 1.2px; text-transform: uppercase; }
.header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

.btn {
  border: 0; cursor: pointer;
  padding: 10px 16px; border-radius: 10px;
  font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s;
  font-family: inherit; white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }
.btn-light { background: rgba(255,255,255,0.14); color: #fff; backdrop-filter: blur(4px); }
.btn-warn { background: #ffd54a; color: #3a2a00; }
.btn-lang { background: var(--accent); color: var(--primary-dark); font-weight: 700; }

.app-main {
  display: grid; grid-template-columns: minmax(320px, 480px) 1fr;
  gap: 20px; padding: 20px;
  max-width: 1500px; margin: 0 auto;
}
.panel {
  background: var(--panel); border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
}

/* Fix Height and Clipping Issue */
.section { margin-bottom: 10px; border-radius: 10px; overflow: visible; border: 1px solid var(--border); }
.section-body { 
    display: none; 
    padding: 20px; 
    background: #fff; 
    height: auto !important; 
    overflow: visible !important; 
}
.section.open .section-body { display: block; }

.field input, .field textarea, .field select {
    width: 100%; padding: 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-family: inherit;
    background: #fafdfc;
    box-sizing: border-box;
}

/* Desktop Scroll */
@media (min-width: 981px) {
  .panel { max-height: calc(100vh - 110px); overflow: hidden; }
  .editor-panel, .preview-panel { padding: 24px; overflow-y: auto; }
}

@media (max-width: 980px) {
  .app-main { grid-template-columns: 1fr; padding: 12px; }
  .panel { max-height: none !important; overflow: visible !important; }
}

.editor-brand { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 18px; }
.editor-brand .crest {
  width: 76px; height: 76px; margin: 0 auto 8px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: var(--accent); border-radius: 50%;
  display: grid; place-items: center;
  font-family: 'Playfair Display', serif; font-weight: 700; font-size: 26px;
  border: 3px solid var(--accent);
}

.section-head {
  width: 100%;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff; border: 0; padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; font-weight: 600; font-size: 15px;
  text-align: start;
}
.section-head .chev { margin-inline-start: auto; transition: transform 0.25s ease; }
.section.open .section-head .chev { transform: rotate(90deg); }

.cv-paper {
  background: #fff; padding: 40px 48px; min-height: 800px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-radius: 6px;
  font-family: 'Georgia', 'Cairo', serif;
}
</style>
</head>
<body dir="ltr">

<header class="app-header">
  <div class="brand">
    <div class="brand-logo">S</div>
    <div class="brand-text">
      <h1 id="titleText">Free Professional CV Builder</h1>
      <p id="taglineText">BUILD YOUR PROFESSIONAL CV IN MINUTES</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn btn-light" onclick="downloadPDF()"><i class="fa-solid fa-download"></i> <span id="downloadText">Download CV</span></button>
    <button class="btn btn-lang" onclick="toggleLang()"><i class="fa-solid fa-language"></i> <span id="langLabel">عربي</span></button>
  </div>
</header>

<main class="app-main">
  <section class="panel editor-panel">
    <div class="editor-brand">
      <div class="crest">S</div>
      <div class="by-line">By: <a href="https://www.linkedin.com/in/sultan-ayed-6502aa156/" target="_blank">SULTAN AYED</a></div>
      <div class="version">Version: 1.1.0</div>
    </div>

    <!-- Basic Information -->
    <div class="section open" id="sec-basic">
      <button class="section-head" onclick="toggleSection('sec-basic')">
        <i class="fa-solid fa-user"></i> <span>Basic Information</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </button>
      <div class="section-body">
        <div class="field"><label>Full Name *</label><input type="text" id="f_name" oninput="render()"></div>
        <div class="field"><label>Email *</label><input type="email" id="f_email" oninput="render()"></div>
        <div class="field"><label>Summary *</label><textarea id="f_summary" oninput="render()"></textarea></div>
      </div>
    </div>

    <!-- Experience -->
    <div class="section" id="sec-exp">
      <button class="section-head" onclick="toggleSection('sec-exp')">
        <i class="fa-solid fa-briefcase"></i> <span>Professional Experience</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </button>
      <div class="section-body">
        <div id="experienceList"></div>
        <button class="btn btn-warn" onclick="addExperience()">+ Add Experience</button>
      </div>
    </div>
  </section>

  <section class="panel preview-panel">
    <div id="cvPaper" class="cv-paper">
        <h2 id="previewName" style="text-align:center; text-transform:uppercase;"></h2>
        <p id="previewEmail" style="text-align:center;"></p>
        <hr style="margin:20px 0;">
        <div id="previewSummary"></div>
        <div id="previewExperience"></div>
    </div>
  </section>
</main>

<script>
let currentLang = 'en';

function toggleSection(id) {
    document.getElementById(id).classList.toggle('open');
}

function toggleLang() {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    document.body.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('langLabel').innerText = currentLang === 'ar' ? 'English' : 'عربي';
    // Logic for translating labels would go here
}

function render() {
    document.getElementById('previewName').innerText = document.getElementById('f_name').value;
    document.getElementById('previewEmail').innerText = document.getElementById('f_email').value;
    document.getElementById('previewSummary').innerHTML = '<h3>Summary</h3><p>' + document.getElementById('f_summary').value + '</p>';
}

function addExperience() {
    const container = document.getElementById('experienceList');
    const div = document.createElement('div');
    div.className = 'field';
    div.innerHTML = `
        <input type="text" placeholder="Company Name" style="margin-bottom:5px;">
        <input type="text" placeholder="Job Title" style="margin-bottom:5px;">
        <input type="text" placeholder="Duration (e.g. 2020 - Present)">
        <hr style="margin:10px 0; border:0; border-top:1px solid #eee;">
    `;
    container.appendChild(div);
}

function downloadPDF() {
    const element = document.getElementById('cvPaper');
    html2pdf().from(element).save('My_CV.pdf');
}
</script>

</body>
</html>
