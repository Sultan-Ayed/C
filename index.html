<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Free Professional CV Builder - By Sultan Ayed</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

<style>
:root {
  --primary: #1f6f54;
  --primary-light: #2e8b6c;
  --accent: #d4af37;
  --bg: #f4f7f6;
  --border: #d8e2dd;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', 'Cairo', sans-serif;
  background-color: var(--primary);
  color: #333;
  line-height: 1.6;
}

/* الحاوية الرئيسية - الحل الجذري هنا */
.app-main {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}

/* لوحة المحرر */
.editor-panel {
  flex: 1;
  min-width: 350px;
  background: white;
  border-radius: 15px;
  padding: 20px;
  /* حذفنا max-height لضمان عدم قص المحتوى */
  height: fit-content; 
}

/* تنسيق الأقسام */
.section {
  margin-bottom: 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: visible !important; /* ضمان عدم القص */
  background: #fff;
}

.section-head {
  width: 100%;
  padding: 15px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 9px;
  display: flex;
  align-items: center;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
}

.section-head i:first-child { margin-right: 10px; }
body[dir="rtl"] .section-head i:first-child { margin-left: 10px; margin-right: 0; }

.chev { margin-inline-start: auto; transition: 0.3s; }
.section.open .chev { transform: rotate(90deg); }

/* محتوى القسم - حل مشكلة الارتفاع */
.section-body {
  display: none;
  padding: 20px;
  background: #fff;
  border-top: 1px solid var(--border);
  height: auto !important; /* تمدد تلقائي */
  min-height: min-content;
  overflow: visible !important;
}

.section.open .section-body {
  display: block;
}

/* الحقول داخل القسم */
.field { margin-bottom: 15px; }
.field label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
.field input, .field textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  background: #fdfdfd;
}

/* زر الإضافة */
.btn-add {
  background: #27ae60;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 5px;
  cursor: pointer;
  font-weight: 600;
  margin-top: 10px;
}

/* لوحة المعاينة */
.preview-panel {
  flex: 1.5;
  min-width: 400px;
  background: #e0e0e0;
  padding: 30px;
  border-radius: 15px;
  position: sticky;
  top: 20px;
  height: calc(100vh - 40px);
  overflow-y: auto;
}

@media (max-width: 850px) {
  .preview-panel { display: none; } /* إخفاء المعاينة في الجوال لتركيز المحرر */
  .app-main { padding: 10px; }
}
</style>
</head>
<body>

<main class="app-main">
  <!-- المحرر -->
  <section class="editor-panel">
    <div style="text-align:center; margin-bottom:20px;">
        <h2 style="color:var(--primary)">Sultan Ayed CV Builder</h2>
        <p style="font-size:12px; color:#666;">Version 1.1.0</p>
    </div>

    <!-- قسم الخبرات المقطوع في صورتك -->
    <div class="section open" id="sec-exp">
      <button class="section-head" onclick="toggleSection('sec-exp')">
        <i class="fa-solid fa-briefcase"></i> 
        <span>Professional Experience</span>
        <i class="fa-solid fa-chevron-right chev"></i>
      </button>
      <div class="section-body">
        <div id="experienceItems">
            <!-- سيتم إضافة الخبرات هنا -->
            <div class="field">
                <label>Company Name</label>
                <input type="text" placeholder="e.g. Saudi Aramco">
            </div>
            <div class="field">
                <label>Job Title</label>
                <input type="text" placeholder="e.g. Cybersecurity Engineer">
            </div>
        </div>
        <button class="btn-add" onclick="alert('Experience Added')">
            <i class="fa-solid fa-plus"></i> Add Experience
        </button>
      </div>
    </div>

    <!-- باقي الأقسام -->
    <div class="section" id="sec-edu">
        <button class="section-head" onclick="toggleSection('sec-edu')">
          <i class="fa-solid fa-graduation-cap"></i> 
          <span>Education</span>
          <i class="fa-solid fa-chevron-right chev"></i>
        </button>
        <div class="section-body">
            <div class="field">
                <label>Degree</label>
                <input type="text" placeholder="e.g. PhD in Cybersecurity">
            </div>
        </div>
    </div>

  </section>

  <!-- المعاينة -->
  <section class="preview-panel">
    <div style="background:white; padding:40px; min-height:100%; box-shadow: 0 0 20px rgba(0,0,0,0.2)">
        <h1 style="text-align:center">Sultan Ayed</h1>
        <hr>
        <p style="margin-top:20px">Your CV content will appear here...</p>
    </div>
  </section>
</main>

<script>
function toggleSection(id) {
    const sec = document.getElementById(id);
    const isOpen = sec.classList.contains('open');
    
    // إغلاق باقي الأقسام لضمان تجربة مستخدم أفضل
    document.querySelectorAll('.section').forEach(s => s.classList.remove('open'));
    
    if (!isOpen) {
        sec.classList.add('open');
    }
}
</script>

</body>
</html>
